# Production overrides. Activate with SPRING_PROFILES_ACTIVE=prod.
# Everything else (datasource, JWT, pagination, allowed-origins) is inherited
# from application.properties and supplied via environment variables.

# Bind to the platform-assigned port. Render (and most PaaS) inject PORT; falls
# back to 8081 for a local prod-profile run. The datasource on a hosted DB is
# supplied via SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD env vars, which
# override the localhost datasource from application.properties.
server.port=${PORT:8081}

# Schema is managed by Flyway and only validated by Hibernate — the app must
# never alter the production schema on its own.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Run Flyway migrations (src/main/resources/db/migration) on startup.
spring.flyway.enabled=true

# The managed Redis used in production restricts the INFO command that Spring's
# built-in Redis health indicator calls, so /actuator/health reported DOWN even
# though Redis is fully functional. Disable that indicator here — Redis health is
# still exercised in practice by login throttling, presence and message fan-out.
management.health.redis.enabled=false

# Disable H2 console in production profile for security
spring.h2.console.enabled=false


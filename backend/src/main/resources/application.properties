spring.application.name=backend

# Load local config from the project-root .env file (works whether the app is
# launched from the project root or from the backend/ directory).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT}

# --- Response compression ---
# gzip JSON (and other text) responses over ~1 KB. A clear win for list payloads
# (messages, channels, search) and compatible with the no-store policy on
# authenticated responses (unlike ETag/conditional GETs, which no-store disables).
server.compression.enabled=true
server.compression.mime-types=application/json,application/problem+json,text/plain,text/css,application/javascript
server.compression.min-response-size=1024

# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection pool (HikariCP) ---
# Managed PostgreSQL on free tiers caps total connections aggressively, so bound
# the pool explicitly (env-overridable) instead of relying on the default of 10
# per instance. max-lifetime stays under the typical server-side idle cutoff so
# the pool recycles connections before the server drops them.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1740000

# --- JWT ---
# Access tokens are short-lived (default 1h); clients silently renew them via
# /api/auth/refresh using the longer-lived (default 7d), server-stored and
# therefore revocable refresh token.
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# --- Account lockout ---
# After this many failed password attempts (within the window) an account is
# temporarily locked; it auto-unlocks after the duration. Kept temporary and
# short to bound the DoS surface of a targeted lockout. State lives in Redis.
app.security.lockout.max-attempts=${LOCKOUT_MAX_ATTEMPTS:10}
app.security.lockout.duration-minutes=${LOCKOUT_DURATION_MINUTES:15}
app.security.lockout.window-minutes=${LOCKOUT_WINDOW_MINUTES:15}

# --- JPA / Hibernate (dev defaults) ---
# Dev iterates on entities with auto schema update and SQL logging. The prod
# profile (application-prod.properties) overrides these with validate + Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable Open Session In View: keep lazy loading inside transactional service
# methods (all responses are mapped to DTOs there) rather than holding a DB
# connection open through view rendering. Avoids the Spring startup warning and
# accidental lazy access / connection-hold outside transactions.
spring.jpa.open-in-view=false

# Flyway runs only in prod; dev relies on ddl-auto=update, so keep it off here
# (otherwise Flyway would clash with the auto-managed dev schema on startup).
spring.flyway.enabled=false

# --- Errors ---
# Return Spring MVC's own errors (404, 405, unreadable body, ...) as RFC 7807
# problem+json too, matching the custom handlers in GlobalExceptionHandler.
spring.mvc.problemdetails.enabled=true

# --- Pagination ---
# Cap client-supplied ?size= so a huge page can't force an oversized query.
spring.data.web.pageable.max-page-size=100

# --- CORS / WebSocket allowed origins ---
# Comma-separated browser origins allowed to call the API and open the WS.
# Dev default is the Vite dev server; prod sets APP_ALLOWED_ORIGINS to the real
# domain(s). Never use "*" together with credentials.
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}

# Comma-separated usernames promoted to global admin on startup (bootstrap for
# the first admin; further grants happen in the admin panel). Empty by default.
app.admin-usernames=${ADMIN_USERNAMES:}

# --- Actuator & metrics ---
# Expose health + info, plus Prometheus/metrics for observability; keep other
# sensitive endpoints closed and the health body minimal (status only).
# prometheus/metrics require authentication (only health+info are permit-listed),
# so they aren't public — but they're readable by any authenticated user. A
# hardened deployment can trim this to "health,info" (or move actuator to a
# separate, network-restricted management port) via MANAGEMENT_EXPOSED_ENDPOINTS.
management.endpoints.web.exposure.include=${MANAGEMENT_EXPOSED_ENDPOINTS:health,info,prometheus,metrics}
management.endpoint.health.show-details=never
# Tag all metrics with the app name so they're attributable when scraped.
management.metrics.tags.application=${spring.application.name}

# --- Distributed tracing (Micrometer Tracing + OpenTelemetry) ---
# traceId/spanId are stamped on every log line for correlation. Spans are
# exported to an OTLP collector (Grafana Tempo / Jaeger / Alloy) only when the
# sampling probability is > 0 — the default 0.0 means no export, so the app runs
# with no collector and produces no exporter noise. Set TRACING_SAMPLE_RATE
# (e.g. 0.1) and OTLP_ENDPOINT to enable real tracing.
management.tracing.sampling.probability=${TRACING_SAMPLE_RATE:0.0}
management.otlp.tracing.endpoint=${OTLP_ENDPOINT:http://localhost:4318/v1/traces}

# --- Logging ---
# Prepend the per-request correlation id (set by RequestIdFilter via MDC) to
# every log line, so logs for one request can be grepped by its X-Request-Id.
logging.pattern.level=%5p [%X{requestId:-}]

# --- File uploads (message image attachments) ---
# Cap upload size. The feature is active only when CLOUDINARY_URL is set
# (cloudinary://<api_key>:<api_secret>@<cloud_name>); otherwise uploads return 503.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# ===================================================================
# REDIS (required — not optional like Cloudinary/Giphy/SMTP)
# ===================================================================
# Carries the distributed rate limiter, login lockout counters, presence, and
# the cross-replica STOMP pub/sub fan-out. Nothing degrades gracefully without
# it: the app boots, then the first message send fails on the rate limiter.
# docker-compose.yml brings one up.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Managed Redis (Upstash, Render, Redis Cloud) requires credentials; a local
# container does not, so this is empty by default.
spring.data.redis.password=${REDIS_PASSWORD:}

# ===================================================================
# WEBSOCKET BROKER CONFIGURATION
# ===================================================================
# Options: simple | rabbitmq
app.websocket.broker.type=${WEBSOCKET_BROKER_TYPE:simple}
spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
app.rabbitmq.stomp.port=${RABBITMQ_STOMP_PORT:61613}

# ===================================================================
# ELASTICSEARCH (For Full-Text Message Search)
# ===================================================================
spring.elasticsearch.uris=http://localhost:9200
# spring.elasticsearch.username=elastic
# spring.elasticsearch.password=changeme

# Search engine toggle. Default on (Elasticsearch). Set
# APP_SEARCH_ELASTICSEARCH_ENABLED=false in a deployment without Elasticsearch:
# message search then falls back to PostgreSQL full-text and the app boots
# without ever contacting ES. The flag also gates the ES repository bootstrap
# and the ES health check, so a disabled deployment never reaches out to ES.
app.search.elasticsearch.enabled=true
spring.data.elasticsearch.repositories.enabled=${app.search.elasticsearch.enabled}
management.health.elasticsearch.enabled=${app.search.elasticsearch.enabled}
# Fail fast instead of hanging startup if a configured ES is unreachable.
spring.elasticsearch.connection-timeout=2s
spring.elasticsearch.socket-timeout=5s

# ===================================================================
# API DOCS (Swagger UI / OpenAPI)
# ===================================================================
# Left on by default so the demo can showcase the API surface. In a real
# production deployment, set SWAGGER_ENABLED=false to stop publishing the API
# map (every mutating endpoint already requires a JWT regardless).
springdoc.api-docs.enabled=${SWAGGER_ENABLED:true}
springdoc.swagger-ui.enabled=${SWAGGER_ENABLED:true}

# ===================================================================
# EMAIL (password reset, email verification)
# ===================================================================
# Transactional email is inactive by default: with no SMTP host configured Spring
# creates no JavaMailSender, and MailService logs the action link instead of
# sending it (so dev/demo works without a mail server). To actually send, set
# MAIL_ENABLED=true and the SMTP connection below.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:no-reply@ripplechat.app}
# Base URL the emailed links point at (the frontend), e.g. https://chat.example.com
app.frontend-base-url=${APP_FRONTEND_BASE_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# With no real SMTP host configured a JavaMailSender is still created (empty
# host); its health indicator would otherwise report DOWN. Mail is best-effort
# (graceful-disable), so keep it out of the aggregate health status.
management.health.mail.enabled=false

# ===================================================================
# OAuth2 (Google sign-in)
# ===================================================================
# Placeholders so the Google registration is present without committing secrets.
# Override in a real deployment via GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET (or
# the SPRING_SECURITY_OAUTH2_... env vars) through Spring's relaxed binding.
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}

spring.application.name=backend

# Load local config from the project-root .env file (works whether the app is
# launched from the project root or from the backend/ directory).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT}

# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- Connection pool (HikariCP) ---
# Managed PostgreSQL on free tiers caps total connections aggressively, so bound
# the pool explicitly (env-overridable) instead of relying on the default of 10
# per instance. max-lifetime stays under the typical server-side idle cutoff so
# the pool recycles connections before the server drops them.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN:2}
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.max-lifetime=1740000

# --- JWT ---
# Access tokens are short-lived (default 1h); clients silently renew them via
# /api/auth/refresh using the longer-lived (default 7d), server-stored and
# therefore revocable refresh token.
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# --- JPA / Hibernate (dev defaults) ---
# Dev iterates on entities with auto schema update and SQL logging. The prod
# profile (application-prod.properties) overrides these with validate + Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Disable Open Session In View: keep lazy loading inside transactional service
# methods (all responses are mapped to DTOs there) rather than holding a DB
# connection open through view rendering. Avoids the Spring startup warning and
# accidental lazy access / connection-hold outside transactions.
spring.jpa.open-in-view=false

# Flyway runs only in prod; dev relies on ddl-auto=update, so keep it off here
# (otherwise Flyway would clash with the auto-managed dev schema on startup).
spring.flyway.enabled=false

# --- Pagination ---
# Cap client-supplied ?size= so a huge page can't force an oversized query.
spring.data.web.pageable.max-page-size=100

# --- CORS / WebSocket allowed origins ---
# Comma-separated browser origins allowed to call the API and open the WS.
# Dev default is the Vite dev server; prod sets APP_ALLOWED_ORIGINS to the real
# domain(s). Never use "*" together with credentials.
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}

# --- Actuator & metrics ---
# Expose health + info, plus Prometheus/metrics for observability; keep other
# sensitive endpoints closed and the health body minimal (status only).
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=never
# Tag all metrics with the app name so they're attributable when scraped.
management.metrics.tags.application=${spring.application.name}

# --- Logging ---
# Prepend the per-request correlation id (set by RequestIdFilter via MDC) to
# every log line, so logs for one request can be grepped by its X-Request-Id.
logging.pattern.level=%5p [%X{requestId:-}]

# --- File uploads (message image attachments) ---
# Cap upload size. The feature is active only when CLOUDINARY_URL is set
# (cloudinary://<api_key>:<api_secret>@<cloud_name>); otherwise uploads return 503.
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

spring.application.name=backend

# Load local config from the project-root .env file (works whether the app is
# launched from the project root or from the backend/ directory).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT}

# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JWT ---
# Access tokens are short-lived (default 1h); clients silently renew them via
# /api/auth/refresh using the longer-lived (default 7d), server-stored and
# therefore revocable refresh token.
jwt.secret=${JWT_SECRET}
jwt.access-expiration=${JWT_ACCESS_EXPIRATION:3600000}
jwt.refresh-expiration=${JWT_REFRESH_EXPIRATION:604800000}

# --- JPA / Hibernate (dev defaults) ---
# Dev iterates on entities with auto schema update and SQL logging. The prod
# profile (application-prod.properties) overrides these with validate + Flyway.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Flyway runs only in prod; dev relies on ddl-auto=update, so keep it off here
# (otherwise Flyway would clash with the auto-managed dev schema on startup).
spring.flyway.enabled=false

# --- Pagination ---
# Cap client-supplied ?size= so a huge page can't force an oversized query.
spring.data.web.pageable.max-page-size=100

# --- CORS / WebSocket allowed origins ---
# Comma-separated browser origins allowed to call the API and open the WS.
# Dev default is the Vite dev server; prod sets APP_ALLOWED_ORIGINS to the real
# domain(s). Never use "*" together with credentials.
app.allowed-origins=${APP_ALLOWED_ORIGINS:http://localhost:5173}

# --- Actuator ---
# Expose only health + info publicly; keep sensitive endpoints closed and the
# health body minimal (status only, no internals).
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

# --- File uploads (message image attachments) ---
# Cap upload size. The feature is active only when CLOUDINARY_URL is set
# (cloudinary://<api_key>:<api_secret>@<cloud_name>); otherwise uploads return 503.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

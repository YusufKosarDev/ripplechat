spring.application.name=backend

# Load local config from the project-root .env file (works whether the app is
# launched from the project root or from the backend/ directory).
spring.config.import=optional:file:.env[.properties],optional:file:../.env[.properties]

server.port=${SERVER_PORT}

# --- PostgreSQL datasource ---
spring.datasource.url=jdbc:postgresql://localhost:${POSTGRES_HOST_PORT}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JWT ---
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# --- JPA / Hibernate (dev) ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Test config (shadows the main application.properties on the test classpath —
# same filename, so *nothing* from the main file applies here; anything the tests
# need has to be repeated below).
#
# The datasource comes from SharedContainers via @DynamicPropertySource in
# AbstractIntegrationTest, so no URL/credentials here. Self-contained: no .env
# import, no Flyway (FlywayMigrationValidationTest opts back in on its own).
spring.application.name=backend-test

# "create", not "create-drop". create-drop registers a Hibernate delayed DROP that
# runs when the SessionFactory closes — i.e. inside SpringApplicationShutdownHook,
# once per cached context. JVM shutdown hooks run concurrently, so Testcontainers
# stops the shared Postgres while those drops are still executing; each one then
# blocks for a full Hikari connection timeout and Surefire kills the fork after
# its 30s grace window. The container is discarded either way, so the drop buys
# nothing. See the pool settings below.
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.flyway.enabled=false

# Mirror the production setting so tests catch any lazy-loading that would only
# fail with Open Session In View disabled.
spring.jpa.open-in-view=false

# Don't seed demo data into the test database.
app.demo.seed=false

# The suite caches ~9 Spring contexts, each with its own pool. At Hikari's default
# maximumPoolSize=10 that is ~90 connections against a postgres:16 whose default
# max_connections is 100. Cap it, and fail fast rather than hanging at shutdown
# (the main application.properties sets these too, but is shadowed by this file).
spring.datasource.hikari.maximum-pool-size=4
spring.datasource.hikari.connection-timeout=5000

# Pinned empty so the AI summariser is deterministically disabled. @Value falls
# through to the OS environment, so without this a developer or CI runner with
# ANTHROPIC_API_KEY exported would fail AiSummaryTests.
ANTHROPIC_API_KEY=

# Mirror production so error-handling tests run under the same MVC config (the
# built-in problem-detail handling is active). This guards the custom handler's
# fieldErrors / Retry-After behaviour against regressions.
spring.mvc.problemdetails.enabled=true

# Fixed test values so tests don't depend on the local .env.
jwt.secret=test-secret-key-that-is-at-least-32-bytes-long-0123456789
jwt.access-expiration=3600000
jwt.refresh-expiration=86400000

spring.security.oauth2.client.registration.google.client-id=test-client-id
spring.security.oauth2.client.registration.google.client-secret=test-client-secret0
app.allowed-origins=http://localhost:5173

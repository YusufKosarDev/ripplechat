name: Repo hygiene

on:
  push:
  pull_request:

# Every check here only reads the checkout.
permissions:
  contents: read

jobs:
  encoding:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The commit-message check walks a revision range, which needs more
          # than the default single-commit checkout.
          fetch-depth: 0

      - name: Check text files have no NUL bytes (encoding corruption guard)
        run: bash scripts/check-encoding.sh

      - name: Check Java sources import types instead of writing them inline
        run: bash scripts/check-java-imports.sh

      # No-op without build artifacts, so it does not force a build here; the
      # backend/frontend workflows produce the reports it reads.
      - name: Check the README's stated test figures still match the build output
        run: bash scripts/check-readme-numbers.sh

      # The remote half of the commit-msg hook. core.hooksPath is local config
      # and is not cloned, so a commit made on another machine, in a fresh
      # checkout, or with --no-verify would otherwise go unchecked. Same script,
      # same rules, so the two cannot drift apart.
      #
      # Scope: the commits this push or pull request adds. To scan the whole
      # history instead, replace the command below with:
      #     bash scripts/check-commit-messages.sh --all
      - name: Check commit messages for automatically added attribution lines
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u
          # A new branch reports an all-zero base, and a force push can name a
          # base that no longer exists; fall back to the tip commit alone.
          if [ -n "$BASE_SHA" ] \
            && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ] \
            && git cat-file -e "${BASE_SHA}^{commit}" 2>/dev/null; then
            range="${BASE_SHA}..${HEAD_SHA}"
          elif git cat-file -e "${HEAD_SHA}~1^{commit}" 2>/dev/null; then
            echo "No usable base commit; checking the tip commit only."
            range="${HEAD_SHA}~1..${HEAD_SHA}"
          else
            echo "No parent commit; checking the tip commit only."
            range="${HEAD_SHA}"
          fi
          echo "Range: ${range}"
          bash scripts/check-commit-messages.sh --range "${range}"

name: Frontend tests

on:
  push:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-tests.yml'
  pull_request:
    paths:
      - 'frontend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm install

      - name: Run tests
        working-directory: frontend
        run: npm test

      # Fail the build on a known high/critical vulnerability in a shipped
      # (production) dependency. Complements Dependabot's update PRs with a gate.
      - name: Audit production dependencies
        working-directory: frontend
        run: npm audit --omit=dev --audit-level=high

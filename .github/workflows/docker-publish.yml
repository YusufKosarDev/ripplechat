name: Publish backend image

# Build the backend container image and push it to the GitHub Container Registry
# on every push to main (and on version tags). Uses the built-in GITHUB_TOKEN —
# no extra secrets needed to publish. If a RENDER_DEPLOY_HOOK_URL secret is set,
# a successful publish also triggers a redeploy; otherwise that step is skipped.
on:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/docker-publish.yml'
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-backend
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Optional hosted-deploy trigger. Set the RENDER_DEPLOY_HOOK_URL repo secret
      # to have a successful publish kick a redeploy; without it this is a no-op.
      - name: Trigger deploy (if configured)
        if: github.ref == 'refs/heads/main'
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -n "$HOOK" ]; then
            curl -fsS -X POST "$HOOK" && echo "Triggered redeploy."
          else
            echo "RENDER_DEPLOY_HOOK_URL not set — skipping deploy trigger."
          fi

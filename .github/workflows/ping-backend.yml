name: Ping Backend (Keep Alive)

on:
  schedule:
    # Render free tier spins the service down after ~15 min idle. GitHub's
    # scheduled runs are often delayed several minutes, so ping every 10 min to
    # keep a safety margin (a single delayed/skipped run no longer lets it sleep).
    # For a hard guarantee, point an external uptime monitor at /actuator/health.
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend API
        run: curl -sSf https://ripplechat-backend.onrender.com/actuator/health || echo "Ping failed but continuing"

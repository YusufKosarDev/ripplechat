name: Ping Backend (Keep Alive)

on:
  # Scheduled pings are retired: GitHub throttles cron workflows under load
  # (observed gaps of 1–4.5 hours between nominally 10-minute runs), so the
  # free-tier backend slept between pings anyway. An external uptime monitor
  # now hits /actuator/health every 5 minutes instead. This workflow remains
  # as a manual warm-up trigger (e.g. right before a live demo).
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend API
        run: curl -sSf https://ripplechat-backend.onrender.com/actuator/health || echo "Ping failed but continuing"

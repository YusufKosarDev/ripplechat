name: Backend tests

on:
  push:
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    paths:
      - 'backend/**'
  # The path filters mean a run-of-the-mill frontend week leaves the README's
  # backend badge showing a result from weeks ago. A weekly run keeps it honest
  # and catches breakage from the environment (base images, Testcontainers)
  # rather than from a commit.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest # Docker is preinstalled, so Testcontainers works
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests + JaCoCo coverage
        working-directory: backend
        run: chmod +x mvnw && ./mvnw -B verify

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: backend/target/site/jacoco/

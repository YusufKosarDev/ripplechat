services:
  postgres:
    image: postgres:16
    container_name: ripplechat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host POSTGRES_HOST_PORT -> container 5432.
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - ripplechat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  ripplechat-pgdata:

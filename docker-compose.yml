services:
  postgres:
    image: postgres:16
    container_name: ripplechat-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      # Host POSTGRES_HOST_PORT -> container 5432.
      - "${POSTGRES_HOST_PORT}:5432"
    volumes:
      - ripplechat-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ripplechat-redis
    restart: unless-stopped
    ports:
      # Host REDIS_HOST_PORT -> container 6379.
      - "${REDIS_HOST_PORT}:6379"
    # No volume on purpose: everything Redis holds here (rate-limit buckets,
    # lockout counters, presence, pub/sub) is ephemeral by design and is meant
    # to be rebuilt from scratch on restart.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Opt-in: only needed for WEBSOCKET_BROKER_TYPE=rabbitmq, the alternative to
  # the default Redis pub/sub bridge. Behind a profile so the everyday
  # `docker compose up -d` does not pull a ~250 MB image nothing will talk to.
  #   docker compose --profile rabbitmq up -d
  rabbitmq:
    image: rabbitmq:3.12-management
    container_name: ripplechat-rabbitmq
    profiles: ["rabbitmq"]
    restart: unless-stopped
    ports:
      - "5672:5672"      # AMQP
      - "15672:15672"    # Management UI
      - "61613:61613"    # STOMP
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    command: sh -c "rabbitmq-plugins enable rabbitmq_stomp && rabbitmq-server"

volumes:
  ripplechat-pgdata:

<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#6366f1" />
    <!-- iOS ignores SVG apple-touch-icons, so this one has to be a bitmap. -->
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="RippleChat" />
    <meta name="description" content="Real-time chat for teams and communities." />
    <title>RippleChat</title>

    <!-- Social sharing cards (Open Graph + Twitter). Scrapers need absolute
         URLs, so these point at the deployed frontend. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="RippleChat" />
    <meta property="og:title" content="RippleChat — real-time team chat" />
    <meta property="og:description" content="Channels, threads, reactions, polls, E2EE DMs and WebRTC calls — a Slack-style workspace that updates live over WebSockets." />
    <meta property="og:url" content="https://ripplechat-app.vercel.app/" />
    <meta property="og:image" content="https://ripplechat-app.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1440" />
    <meta property="og:image:height" content="900" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="RippleChat — real-time team chat" />
    <meta name="twitter:description" content="Channels, threads, reactions, polls, E2EE DMs and WebRTC calls — live over WebSockets." />
    <meta name="twitter:image" content="https://ripplechat-app.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
